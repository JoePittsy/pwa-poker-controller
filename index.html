<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PokerPad</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17143a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PokerPad">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg"></div>
<div id="app">
  <div id="mat"></div>
  <div id="center">
    <div id="boardwrap">
      <div id="pot" hidden><small>POT</small><b id="pot-n"></b><span id="pot-chips" class="pile"></span></div>
      <div id="board"></div>
      <div id="deck"><div class="in back"></div><div class="in back"></div></div>
      <div id="burn"></div>
    </div>
    <div id="msg"></div>
  </div>
  <div id="seats"></div>
  <div id="hud"></div>
  <button id="menu-btn" aria-label="Menu">&#9776;</button>
  <button id="talk-btn" aria-label="Table talk">&hellip;</button>
  <div id="emotes" hidden></div>
  <div id="actions"></div>
  <div id="toast"></div>
  <div id="overlay" hidden></div>
</div>
<div id="fx"></div>
<div id="rotate"><div>&#8635;</div>Rotate to landscape</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
